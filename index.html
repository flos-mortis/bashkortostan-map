<div id="info"><h2>Выберите район на карте</h2></div>
<div id="tip"></div>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQIlZnhA5kNBLyFZexFpCkvRm9dZySAkgbVSF0zNr3pJlGFcEP_WQwO0GPM2_PiBnJAs38HG9vvkqM3/pub?gid=1523102851&single=true&output=csv';

  const svg = document.querySelector('#map svg');
  const box = document.getElementById('info');
  const tip = document.getElementById('tip');
  let active = null;

  function loadInfo() {
    return new Promise((resolve, reject) => {
      Papa.parse(SHEET_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: res => {
          const data = {};
          res.data.forEach(r => {
            const name = (r.name || '').trim();
            if (!name) return;
            data[name] = {
              center: (r.center || '').trim(),
              text: (r.text || '').replace(/\n/g, '<br>'),
              image: (r.image || '').trim(),
              link: (r.link || '').trim(),
              dx: parseFloat(r.dx) || 0,
              dy: parseFloat(r.dy) || 0
            };
          });
          resolve(data);
        },
        error: reject
      });
    });
  }

  loadInfo().then(info => {
    svg.querySelectorAll('path').forEach(p => {
      const name = p.dataset.name;          
      if (!name) return;
      if (!info[name]) console.warn('Нет строки в таблице для:', name);

      p.addEventListener('mousemove', e => {
        tip.textContent = name;
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 12) + 'px';
        tip.style.top = (e.clientY + 12) + 'px';
      });
      p.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

      p.addEventListener('click', () => {
        if (active) active.classList.remove('active');
        active = p;
        p.classList.add('active');

        const d = info[name] || {};
        let html = '<h2>' + name + '</h2>';
        if (d.image) html += '<img src="' + d.image + '" alt="">';
        html += '<div>' + (d.text || 'Данных пока нет') + '</div>';
        if (d.link) html += '<p><a href="' + d.link + '" target="_blank">Подробнее</a></p>';
        box.innerHTML = html;
      });
    });

    const NS = 'http://www.w3.org/2000/svg';
    const labels = document.createElementNS(NS, 'g');
    labels.setAttribute('id', 'labels');
    svg.querySelector('path').parentNode.appendChild(labels);

    svg.querySelectorAll('path').forEach(p => {
      const d = info[p.dataset.name];        // или p.id
      if (!d || !d.center) return;
      const b = p.getBBox();
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', b.x + b.width / 2 + d.dx);
      t.setAttribute('y', b.y + b.height / 2 + d.dy);
      t.textContent = d.center;
      labels.appendChild(t);
    });

  }).catch(err => {
    box.innerHTML = '<h2>Не удалось загрузить данные</h2><p>' + err + '</p>';
  });
</script>
</script>
